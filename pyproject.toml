[build-system]
# setuptools>=77 is needed for the PEP 639 SPDX license form (license = "MIT")
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "github_copilot_login"
version = "0.2.0"
description = "Use your own GitHub Copilot subscription from Python by driving the official copilot CLI (no token reading)."
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
